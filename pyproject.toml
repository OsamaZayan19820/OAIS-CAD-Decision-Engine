[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oais-cad-decision-engine"
version = "0.1.0"
description = "Evidence-bounded 2D CAD geometry validation and export"
requires-python = ">=3.10"
dependencies = ["ezdxf>=1.3,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]
