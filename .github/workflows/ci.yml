name: Python tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Dependency vulnerability gate
        run: |
          python -m pip install 'pip-audit==2.9.0'
          python -m pip_audit --strict --progress-spinner off
      - name: Syntax gate
        run: python -m compileall -q src tests
      - name: Regression tests
        run: python -m pytest -q
      - name: V0.2 export smoke
        run: |
          python -m oais_cad.cli_v02 examples/v02_walls.json build/v02
          test -s build/v02/layout_v02.dxf
          test -s build/v02/preview_v02.svg
          test -s build/v02/report_v02.json
