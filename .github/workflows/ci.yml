name: Python tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Installed dependency consistency gate
        run: |
          python -m pip check
          python scripts/check_installed_constraints.py
          python -m pip freeze --all > installed-dependencies.txt
          python - <<'PY'
          from importlib.metadata import version
          from pathlib import Path
          for name in ("ezdxf", "pytest"):
              installed = version(name)
              assert installed, f"Missing dependency: {name}"
              print(f"Verified installed dependency: {name}=={installed}")
          assert Path("installed-dependencies.txt").stat().st_size > 0
          PY
      - name: Dependency vulnerability gate
        run: |
          python -m pip install 'pip-audit==2.9.0'
          python -m pip_audit --strict --progress-spinner off -r requirements-audit.txt
      - name: Candidate lock script syntax gate
        run: bash -n scripts/generate_candidate_lock.sh
      - name: Syntax gate
        run: python -m compileall -q src tests
      - name: Regression tests
        run: python -m pytest -q
      - name: V0.2 export smoke
        run: |
          python -m oais_cad.cli_v02 examples/v02_walls.json build/v02
          test -s build/v02/layout_v02.dxf
          test -s build/v02/preview_v02.svg
          test -s build/v02/report_v02.json

      - name: Review-only SVG smoke
        run: |
          python -m oais_cad.preview_cli_v02 examples/v02_walls.json build/v02/review_sheet.svg
          test -s build/v02/review_sheet.svg
          python -m pytest -q tests/test_visual_review_v02.py

  candidate-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Resolve, verify hashes and run locked CAD regressions
        run: bash scripts/generate_candidate_lock.sh
      - name: Archive candidate lock for human review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-lock-py${{ matrix.python-version }}
          path: requirements-locked-candidate.txt
          if-no-files-found: error
          retention-days: 7
